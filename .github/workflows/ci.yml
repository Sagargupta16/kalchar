name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Least-privilege default: CI only reads the repo to lint/typecheck/build.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Display name is pinned to the required status check in the "main
    # protection" ruleset -- rename both together or merges to main block.
    name: lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KALCHAR_TEST_FIXTURES: "1"
      NEXT_PUBLIC_IMAGE_BASE_URL: https://fixtures.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Create temporary authentication secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "AUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("hex") + "\n")'

      - name: Lint
        run: pnpm lint

      - name: Migration artifact guard
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx 'lib/db/schema.ts'; then
            if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Eq '^drizzle/[0-9].*\.sql$'; then
              echo '::error::lib/db/schema.ts changed without a committed SQL migration.'
              exit 1
            fi
          fi

      - name: UI token guard
        # The design system routes depth, motion, type size, focus and z-order
        # through tokens (app/globals.css) and shared strings (controls.ts).
        # scripts/check-ui-tokens.mjs fails the build when raw utilities drift
        # back in; warn-tier patterns become errors at the integration step.
        # See .claude/rework/final/system.md section 8 and docs/UI-CONSISTENCY-PLAN.md.
        run: pnpm lint:ui

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      - name: Typecheck browser fixtures
        run: pnpm typecheck:tests

      - name: Test
        # Pure logic, isolated action checks and disposable database migrations.
        run: pnpm test

      - name: Test operational safeguards
        run: pnpm test:operations

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_PORT: 3001

  migrations:
    name: database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kalchar_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d kalchar_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/kalchar_migration_test
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration artifacts
        run: pnpm db:validate
      - name: Verify migrations and concurrent bootstrap on disposable PostgreSQL
        run: pnpm db:check
