packages:
  - "."

# pnpm 12 fails the install when a dependency's build script is skipped
# (ERR_PNPM_IGNORED_BUILDS); esbuild's postinstall only places its binary.
allowBuilds:
  esbuild: true

overrides:
  "postcss@<8.5.23": ">=8.5.23"
  # nanoid <3.3.18 (GHSA-2v37-7h3g-55p8) reaches us through postcss. nanoid 4+
  # is ESM-only; postcss loads it with require(), which Node 22.12+ and 26 run.
  "nanoid@<3.3.18": "<7"
  # source-map-js <1.2.2 (GHSA-68fv-2mgg-jv7q) also reaches us through postcss.
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  esbuild: ">=0.28.1"
  # Keep Next's optional image optimizer and our R2 pipeline on the same
  # patched native parser, including the GHSA-rgj7-g3m4-5g8c and
  # GHSA-wq5f-xc86-pv6w (librsvg) fixes.
  sharp: "^0.35.5"
