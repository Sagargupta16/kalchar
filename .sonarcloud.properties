# SonarCloud Automatic Analysis reads this file (sonar-project.properties is
# only read by the scanner CLI, which this repository does not run).
#
# The stylesheets under app/ are Tailwind 4 source, not plain CSS: @theme,
# @utility with nested "&" rules, @custom-variant and @import that Tailwind
# inlines at build time. Sonar's CSS analyzer parses them as plain CSS and
# reports "missing scoping root", "invalid position for declaration" and
# "invalid position for @import" on every such block: 16 false positives that
# failed the reliability gate on PR 105. Biome lints these files and
# scripts/check-ui-tokens.mjs guards their conventions.
sonar.exclusions=app/*.css,app/**/*.css
