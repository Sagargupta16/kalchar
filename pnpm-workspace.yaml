packages:
  - "."

overrides:
  "postcss@<8.5.23": ">=8.5.23"
  # nanoid <3.3.18 (GHSA-2v37-7h3g-55p8) reaches us through postcss; cap at <4
  # because nanoid 4+ is ESM-only and postcss requires the CJS 3.x line.
  "nanoid@<3.3.18": ">=3.3.18 <4"
  esbuild: ">=0.28.1"
  # next ships sharp 0.34.5 as an optional dep for its image optimizer, which
  # carries the libvips CVE-2026-33327 chain; pin it to the version our own
  # R2 variant pipeline already uses so only one copy is installed.
  sharp: "^0.35.3"
